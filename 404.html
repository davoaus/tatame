  <script>
    (function () {
      var mostrado = false;
      function vazio() {
        var r = document.getElementById('root');
        return !r || r.childElementCount === 0;
      }
      function mostrar(msg) {
        if (mostrado) return; mostrado = true;
        try { localStorage.setItem('beltup_ultimo_erro', String(msg).slice(0, 500)); } catch (e) {}
        setTimeout(function () {
          if (!vazio()) return;
          document.body.style.background = '#0A0C10';
          document.body.innerHTML =
            '<div style="font-family:system-ui;color:#EEF2F7;padding:28px;max-width:560px;margin:0 auto">' +
            '<h2 style="font-size:18px;margin:0 0 8px">O app travou ao abrir</h2>' +
            '<p style="color:#9FACBC;font-size:14px;line-height:1.5;margin:0 0 14px">Mande esta mensagem para o suporte:</p>' +
            '<pre style="white-space:pre-wrap;background:#131821;border:1px solid #222A36;border-radius:12px;padding:12px;font-size:12px;color:#FF9E9E">' +
            String(msg).replace(/[<>]/g, '') + '</pre>' +
            '<button id="beltup-reparar" style="margin-top:16px;background:#2F6BFF;color:#fff;border:0;border-radius:10px;padding:14px 26px;font-size:15px;font-weight:600">Limpar e tentar de novo</button></div>';
          var btn = document.getElementById('beltup-reparar');
          if (btn) btn.onclick = function () {
            var fim = function () { location.replace('/tatame/?r=' + Date.now()); };
            var t = [];
            try { localStorage.removeItem('beltup_cache_v3'); localStorage.removeItem('beltup_cache_v2'); } catch (e) {}
            if (window.caches) t.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }));
            if (navigator.serviceWorker) t.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }));
            Promise.all(t).then(fim, fim);
          };
        }, 1200);
      }
      window.addEventListener('error', function (e) { mostrar((e.message || 'erro') + ' @ ' + (e.filename || '').split('/').pop() + ':' + e.lineno); });
      window.addEventListener('unhandledrejection', function (e) { mostrar('promessa: ' + ((e.reason && (e.reason.message || e.reason)) || 'erro')); });
    })();
  </script>
